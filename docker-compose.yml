services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: algo_bot
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: algo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
